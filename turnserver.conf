# =============================================
# TURN Server Configuration
# Coturn (STUN/TURN Server)
# =============================================

# --- Server Settings ---
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Listening IP (bind to all interfaces)
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# External IP (your VPS public IP)
external-ip=103.167.89.48

# --- Authentication ---
# Simple static user accounts
user=dongduongco:duong123456
user=dongduongco2:duong654321

# OR use long-term credentials (uncomment below and comment out user lines above)
# lt-cred-mech
# stale-nonce=600

# --- Realm ---
realm=dongduongco.site

# --- Security ---
# Bảo mật: chỉ cho phép user đã đăng ký
# no-loopback-peers
# no-multicast-peers

# --- Logging ---
# Log level: 0=normal, 1=verbose
Verbose
# syslog

# --- Performance ---
max-bps=0
total-quota=100
bps-capacity=0

# --- STUN only (disable relay if you only want STUN) ---
# no-relay

# --- Fingerprint ---
fingerprint

# --- lt-cred-mech (recommended for WebRTC) ---
lt-cred-mech

# --- TURN REST API (for WebRTC clients) ---
# secret=your-turn-rest-api-secret
# oauth

# --- Channels (optional, improves performance) ---
# ct

# --- Origin header check (disable if needed) ---
# no-origin

# --- Stats ---
# stats-report-delay=300

# --- CLI Interface (optional) ---
# cli-port=5766
# cli-password=your-cli-password
